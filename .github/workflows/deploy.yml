# Author: Alex Picon <alexnpc@me.com>
name: Deploy Keeper to Vultr
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keeper-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run --no-dev python -m unittest discover -s tests -p 'test_keeper*.py'
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure deployment SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and deploy exact commit
        env:
          DEPLOY_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          test -n "$DEPLOY_HOST"
          git archive --format=tar.gz HEAD > /tmp/keeper.tar.gz
          ssh -o BatchMode=yes deploy@"$DEPLOY_HOST" "mkdir -p /opt/keeper/releases/$GITHUB_SHA"
          scp -o BatchMode=yes /tmp/keeper.tar.gz deploy@"$DEPLOY_HOST":/opt/keeper/releases/"$GITHUB_SHA"/source.tar.gz
          ssh -o BatchMode=yes deploy@"$DEPLOY_HOST" "cd /opt/keeper/releases/$GITHUB_SHA && tar -xzf source.tar.gz && bash deploy/release.sh $GITHUB_SHA"
